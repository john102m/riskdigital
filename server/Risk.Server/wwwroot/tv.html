<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Risk — TV Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { background: #000; color: #eee; font-family: system-ui, sans-serif; }
        .map-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        .map-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .map-overlay { position: absolute; opacity: 0; transition: opacity 0.3s; }
        .territory { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; width: 2.5vw; height: 2.5vw; max-width: 34px; max-height: 34px; border-radius: 50%; font-size: min(1vw, 13px); font-weight: bold; color: #fff; border: 2px solid rgba(0,0,0,0.5); text-shadow: 1px 1px 1px rgba(0,0,0,0.8); cursor: default; }
        .territory:hover::after { content: attr(data-name); position: absolute; top: -22px; white-space: nowrap; font-size: 10px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 3px; }
        .territory.glow-source { box-shadow: 0 0 12px 4px #68d391; }
        .territory.glow-target { box-shadow: 0 0 12px 4px #fc8181; }
        .t-label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 8px; white-space: nowrap; color: #fff; text-shadow: 1px 1px 2px #000; margin-top: 1px; }
        .info-box { position: fixed; bottom: 12px; left: 24px; background: #fef3c7; border: 2px solid #92400e99; border-radius: 8px; padding: 10px 14px; z-index: 100; max-width: 260px; color: #451a03; font-weight: bold; }
        .info-box .game-code { font-size: 18px; font-weight: bold; letter-spacing: 3px; color: #451a03; }
        .info-box .phase { font-size: 12px; color: #78350f; margin-left: 8px; }
        .info-box .status { font-size: 11px; color: #92400e; }
        .info-box .status.connected { color: #166534; }
        .info-box .players { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
        .player-chip { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .player-chip.active { outline: 2px solid #166534; }
        .player-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
        .no-game { color: #666; font-style: italic; padding: 24px; }
        .dice-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fef3c7; border: 2px solid #92400e99; border-radius: 8px; padding: 12px 16px; font-size: 18px; z-index: 100; transition: opacity 0.3s; color: #451a03; }
        .dice-overlay.hidden { opacity: 0; pointer-events: none; }
        .dice-atk { color: #166534; }
        .dice-def { color: #991b1b; }
    </style>
</head>
<body>
    <div class="map-container" id="map" style="display:none;">
        <img src="/risk-board-game-map-cropped.jpg" alt="Risk Map" />
        <div class="map-overlay" id="map-overlay"></div>
    </div>

    <div class="info-box">
        <div><span id="status" class="status">Connecting...</span></div>
        <div id="game-info"></div>
        <div class="players" id="players-bar"></div>
    </div>

    <div id="dice-overlay" class="dice-overlay hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
        // Territory centre coordinates as percentages [x, y] — index matches territory ID
        // Based on 2560x1773 image with black borders baked in

        const COORDS_RAW = [
            [8.1, 15.3],   // 0  Alaska
            [16.9, 15.8],  // 1  Northwest Territory
            [35, 10.3],    // 2  Greenland
            [16, 22.9],    // 3  Alberta
            [22.3, 25.2],  // 4  Ontario
            [29, 24.5],    // 5  Quebec
            [16.5, 33.1],  // 6  Western United States
            [23.3, 36.1],  // 7  Eastern United States
            [16, 42.3],    // 8  Central America
            [23.7, 54.2],  // 9  Venezuela
            [30.9, 63],  // 10  Brazil
            [25.9, 67.2],  // 11  Peru
            [26.4, 75.4],  // 12  Argentina
            [42.9, 20.3],  // 13  Iceland
            [49.6, 20.8],  // 14  Scandinavia
            [42.5, 32.6],  // 15  Great Britain
            [49.9, 32.3],  // 16  Northern Europe
            [59.2, 26],  // 17  Ukraine
            [42.5, 45.7],  // 18  Western Europe
            [52.4, 41.2],  // 19  Southern Europe
            [45, 59.4],    // 20  North Africa
            [53.5, 55.1],  // 21  Egypt
            [57.7, 64.7],  // 22  East Africa
            [54.3, 71.3],  // 23  Congo
            [63.6, 84],    // 24  Madagascar
            [54.9, 83.4],  // 25  South Africa
            [68.8, 22.5],  // 26  Ural
            [74.4, 18.3],  // 27  Siberia
            [66.9, 35.4],  // 28  Afghanistan
            [80.8, 13.8],  // 29  Yakutsk
            [61, 50.9],    // 30  Middle East
            [80.4, 24.8],  // 31  Irkutsk
            [72.8, 50.2],  // 32  India
            [78.1, 42.6],  // 33  China
            [80.6, 34.6],  // 34  Mongolia
            [80.3, 54.1],  // 35  Siam
            [87.8, 13.9],  // 36  Kamchatka
            [91.1, 35.6],  // 37  Japan
            [82.2, 69.4],  // 38  Indonesia
            [90.5, 66.7],  // 39  New Guinea
            [86.3, 82.9],  // 40  Western Australia
            [94.8, 83.5],  // 41  Eastern Australia
        ];
        const COORDS = COORDS_RAW;

        const statusEl = document.getElementById('status');
        const gameInfo = document.getElementById('game-info');
        const playersBar = document.getElementById('players-bar');
        const mapEl = document.getElementById('map');
        const mapImg = mapEl.querySelector('img');
        const mapOverlay = document.getElementById('map-overlay');

        function syncOverlay() {
            if (!mapImg.naturalWidth) return;
            const cw = window.innerWidth;
            const ch = window.innerHeight;
            const natRatio = mapImg.naturalWidth / mapImg.naturalHeight;
            const containerRatio = cw / ch;
            let w, h;
            if (containerRatio > natRatio) {
                h = ch;
                w = h * natRatio;
            } else {
                w = cw;
                h = w / natRatio;
            }
            mapOverlay.style.width = w + 'px';
            mapOverlay.style.height = h + 'px';
            mapOverlay.style.left = ((cw - w) / 2) + 'px';
            mapOverlay.style.top = ((ch - h) / 2) + 'px';
            mapOverlay.style.opacity = '1';
        }
        mapImg.addEventListener('load', syncOverlay);
        window.addEventListener('resize', syncOverlay);
        setTimeout(syncOverlay, 100);
        setTimeout(syncOverlay, 500);

        // Keep screen awake
        if (navigator.wakeLock) {
            navigator.wakeLock.request('screen').catch(() => {});
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {});
            });
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl('/gamehub')
            .withAutomaticReconnect([0, 1000, 2000, 5000, 10000, 30000])
            .build();

        connection.on('GameStateUpdated', render);


        let missionWinDesc = null;
        connection.on('MissionComplete', (playerIndex, description) => {
            missionWinDesc = description;
        });
        connection.on('CardTraded', (playerIndex, armies) => {
            const state = lastState;
            const name = state ? state.players[playerIndex]?.name : 'Player ' + playerIndex;
            showDice(`🃏 ${name} traded cards → +${armies} armies`);
        });

        const diceEl = document.getElementById('dice-overlay');
        let diceTimer = null;
        function showDice(html) {
            diceEl.innerHTML = html;
            diceEl.classList.remove('hidden');
            clearTimeout(diceTimer);
            diceTimer = setTimeout(() => diceEl.classList.add('hidden'), 5000);
        }

        connection.on('CombatResult', (result) => {
            const atk = result.attackerDice.join(', ');
            const def = result.defenderDice.join(', ');
            const targetName = lastState?.territories?.[result.targetId]?.name || '';
            showDice(`🎲 <span class="dice-atk">${atk}</span> vs <span class="dice-def">${def}</span>${result.captured ? '<br>⚔️ ' + targetName + ' captured!' : ''}`);
        });

        connection.on('BlitzResult', (result) => {
            const targetName = lastState?.territories?.[result.targetId]?.name || '';
            showDice(`⚡ Blitz · ${result.rounds} rounds · Lost: <span class="dice-atk">${result.totalAttackerLosses}</span> / <span class="dice-def">${result.totalDefenderLosses}</span>${result.captured ? '<br>⚔️ ' + targetName + ' captured!' : ''}`);
        });

        connection.on('AttackSelection', (sourceId, targetId) => {
            document.querySelectorAll('.territory.glow-source, .territory.glow-target').forEach(el => {
                el.classList.remove('glow-source', 'glow-target');
            });
            if (sourceId !== null) {
                const src = document.querySelector(`.territory[data-id="${sourceId}"]`);
                if (src) src.classList.add('glow-source');
            }
            if (targetId !== null) {
                const tgt = document.querySelector(`.territory[data-id="${targetId}"]`);
                if (tgt) tgt.classList.add('glow-target');
            }
        });

        let lastState = null;
        let turnStart = Date.now();
        let lastPlayerIndex = -1;
        setInterval(() => {
            if (!lastState || lastState.phase !== 'Playing') return;
            const el = document.querySelector('.player-chip.active .turn-timer');
            if (el) el.textContent = Math.floor((Date.now() - turnStart) / 1000) + 's';
        }, 1000);

        connection.onreconnecting(() => {
            statusEl.textContent = 'Reconnecting...';
            statusEl.className = 'status';
        });

        connection.onreconnected(() => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
            connection.invoke('GetState');
        });

        connection.start().then(() => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
            connection.invoke('GetState');
        });

        function render(state) {
            lastState = state;
            if (!state) {
                gameInfo.innerHTML = '';
                playersBar.innerHTML = '';
                mapEl.style.display = 'none';
                document.getElementById('map-overlay').innerHTML = '';
                var go = document.getElementById('gameover-overlay');
                if (go) go.remove();
                missionWinDesc = null;
                return;
            }

            gameInfo.innerHTML = `
                <span class="game-code">${state.gameCode}</span>
                <span class="phase">${state.phase}${state.phase === 'Playing' ? ' — ' + state.turnPhase : ''}</span>
            `;

            // Game Over overlay
            var overlay = document.getElementById('gameover-overlay');
            if (state.phase === 'GameOver') {
                const winner = state.players[state.currentPlayerIndex];
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'gameover-overlay';
                    overlay.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:999;';
                    document.body.appendChild(overlay);
                }
                overlay.innerHTML = `<div style="background:rgba(0,0,0,0.9);border:1px solid #444;border-radius:12px;padding:32px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;"><div style="font-size:64px">🏆</div><div style="font-size:28px;font-weight:bold;color:${winner.colour}">${winner.name} wins!</div><div style="color:#aaa;font-size:16px">${missionWinDesc || "World domination achieved"}</div></div>`;
            } else if (overlay) {
                overlay.remove();
            }

            playersBar.innerHTML = state.players.map((p, i) => {
                const terrs = state.territories ? state.territories.filter(t => t.ownerId === i) : [];
                const armies = terrs.reduce((s, t) => s + t.armies, 0);
                const active = state.currentPlayerIndex === i ? ' active' : '';
                const timer = state.currentPlayerIndex === i ? '<span class="turn-timer" style="margin-left:6px;color:#facc15;font-size:11px;">0s</span>' : '';
                const info = terrs.length ? ` (${terrs.length}t · ${armies}a${p.reinforcementsRemaining ? ' · ' + p.reinforcementsRemaining + '↓' : ''})` : '';
                return `<div class="player-chip${active}"><span class="dot" style="background:${p.colour}"></span>${p.name}${info}${timer}</div>`;
            }).join('');
            if (state.currentPlayerIndex !== lastPlayerIndex) {
                turnStart = Date.now();
                lastPlayerIndex = state.currentPlayerIndex;
            }

            if (!state.territories || !state.territories.length) {
                mapEl.style.display = 'none';
                return;
            }

            mapEl.style.display = 'flex';
            syncOverlay();
            // Remove old markers
            const mapOverlay = document.getElementById('map-overlay');
            mapOverlay.innerHTML = '';

            // Size overlay to match rendered image
            const img = mapEl.querySelector('img');
            mapOverlay.style.width = img.offsetWidth + 'px';
            mapOverlay.style.height = img.offsetHeight + 'px';

            state.territories.forEach(t => {
                const [x, y] = COORDS[t.id];
                const colour = t.ownerId >= 0 ? state.players[t.ownerId].colour : '#666';
                const div = document.createElement('div');
                div.className = 'territory';
                div.setAttribute('data-id', t.id);
                div.setAttribute('data-name', t.name);
                div.style.left = x + '%';
                div.style.top = y + '%';
                div.style.background = colour;
                div.innerHTML = `${t.armies}<span class="t-label">${t.name}</span>`;
                mapOverlay.appendChild(div);
            });
        }
    </script>
</body>
</html>
